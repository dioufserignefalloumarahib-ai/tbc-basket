{% extends 'base.html' %}{% block title %}{{ form_title }}{% endblock %}{% block heading %}{{ form_title }}{% endblock %}{% block content %}<section class="panel form-panel"><form method="post" class="edit-form"><div class="form-grid"><label>Nom du demandeur *<input name="requester" required></label><label>Téléphone<input name="phone"></label><label>Date *<input type="date" name="reservation_date" required></label><label>Heure de début *<input type="time" name="start_time" required></label><label>Heure de fin *<input type="time" name="end_time" required></label><label>Statut<select name="status"><option>En attente</option><option>Confirmée</option><option>Annulée</option><option>Terminée</option></select></label><label class="full">Motif<textarea name="reason" rows="4" placeholder="Entraînement, match, événement..."></textarea></label></div><div class="form-actions"><a class="button outline" href="{{ url_for('reservations') }}">Annuler</a><button class="button primary">Créer la réservation</button></div></form></section>{% endblock %}
