{% extends 'base.html' %}{% block title %}{{ form_title }}{% endblock %}{% block heading %}{{ form_title }}{% endblock %}{% block content %}<section class="panel form-panel"><form method="post" class="edit-form"><div class="form-grid"><label>Nom du système *<input name="name" required value="{{ system.name if system else '' }}"></label><label>Type<select name="system_type"><option value="attaque" {% if system and system.system_type == 'attaque' %}selected{% endif %}>Attaque</option><option value="défense" {% if system and system.system_type == 'défense' %}selected{% endif %}>Défense</option><option value="transition" {% if system and system.system_type == 'transition' %}selected{% endif %}>Transition</option></select></label><label>Nombre de joueurs<input type="number" name="player_count" min="1" max="12" value="{{ system.player_count if system else 5 }}"></label><label>Entraîneur<input name="coach" value="{{ system.coach if system else '' }}"></label><label class="full">Description<textarea name="description" rows="3">{{ system.description if system else '' }}</textarea></label><label class="full">Objectif<textarea name="objective" rows="3">{{ system.objective if system else '' }}</textarea></label><label>Points clés<textarea name="key_points" rows="3">{{ system.key_points if system else '' }}</textarea></label><label>Consignes<textarea name="instructions" rows="3">{{ system.instructions if system else '' }}</textarea></label><label>Statut<select name="status"><option value="active" {% if not system or system.status == 'active' %}selected{% endif %}>Actif</option><option value="inactive" {% if system and system.status == 'inactive' %}selected{% endif %}>Inactif</option></select></label><label class="full">Catégories concernées<select name="category_ids" multiple>{% for category in categories %}<option value="{{ category.id }}" {% if category.id in selected %}selected{% endif %}>{{ category.name }}</option>{% endfor %}</select></label></div><div class="form-actions"><a class="button outline" href="{{ url_for('classes_systems') }}">Annuler</a><button class="button primary">Enregistrer</button></div></form></section>{% endblock %}
