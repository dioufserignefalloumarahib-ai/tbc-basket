{% extends 'base.html' %}{% block title %}{{ form_title }}{% endblock %}{% block heading %}{{ form_title }}{% endblock %}{% block content %}<section class="panel form-panel"><form method="post" class="edit-form"><div class="form-grid"><label>Équipe TBC<select name="team_id"><option value="">Choisir</option>{% for team in teams %}<option value="{{ team.id }}">{{ team.name }}</option>{% endfor %}</select></label><label>Adversaire *<input name="opponent" required></label><label>Date *<input type="date" name="match_date" required></label><label>Heure<input type="time" name="match_time"></label><label>Lieu<input name="venue" value="Terrain TBC"></label><label>Compétition<input name="competition"></label><label>Statut<select name="status"><option>À venir</option><option>En cours</option><option>Terminé</option><option>Reporté</option><option>Annulé</option></select></label><label>Score TBC<input type="number" name="home_score" min="0" value="0"></label><label>Score adversaire<input type="number" name="away_score" min="0" value="0"></label></div><div class="form-actions"><a class="button outline" href="{{ url_for('matches') }}">Annuler</a><button class="button primary">Enregistrer le match</button></div></form></section>{% endblock %}
