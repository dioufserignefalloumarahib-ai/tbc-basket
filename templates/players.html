{% extends 'base.html' %}{% block title %}Joueurs{% endblock %}{% block heading %}Joueurs{% endblock %}{% block content %}<div class="page-tools"><div><p class="lede">L'effectif du club, en un coup d'œil.</p></div><button class="button primary" onclick="alert('Le formulaire d’ajout sera disponible dans la prochaine itération.')">＋ Ajouter un joueur</button></div><section class="panel"><form class="filters"><label class="search-input">⌕<input name="q" value="{{ search }}" placeholder="Rechercher un joueur..."></label><select name="team"><option value="">Toutes les équipes</option>{% for team in teams %}<option value="{{ team.id }}" {% if team_id|string == team.id|string %}selected{% endif %}>{{ team.name }}</option>{% endfor %}</select><select name="position"><option value="">Tous les postes</option>{% for item in ['Meneur','Arrière','Ailier','Ailier fort','Pivot'] %}<option {% if position == item %}selected{% endif %}>{{ item }}</option>{% endfor %}<button class="button outline">Filtrer</button></form><div class="table-wrap"><table><thead><tr><th>Joueur</th><th>Équipe</th><th>Poste</th><th>N°</th><th>Téléphone</th><th>Statut</th></tr></thead><tbody>{% for player in players %}<tr><td><span class="player-avatar">{{ player.first_name[0] }}{{ player.last_name[0] }}</span><b>{{ player.first_name }} {{ player.last_name }}</b></td><td>{{ player.team_name or 'Sans équipe' }}</td><td>{{ player.position or '—' }}</td><td class="number">{{ '%02d'|format(player.jersey_number or 0) }}</td><td>{{ player.phone or '—' }}</td><td><span class="badge success">{{ player.status }}</span></td></tr>{% else %}<tr><td colspan="6" class="empty">Aucun joueur trouvé.</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
