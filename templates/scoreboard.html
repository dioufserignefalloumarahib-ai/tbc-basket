{% extends 'base.html' %}{% block title %}Tableau de score{% endblock %}{% block heading %}Tableau de score{% endblock %}{% block content %}<div class="scoreboard" id="scoreboard"><div class="score-head"><span class="eyebrow orange">MATCH EN DIRECT</span><span id="periodLabel">Q1 · 10:00</span><button class="fullscreen" onclick="document.getElementById('scoreboard').requestFullscreen()">⛶</button></div><div class="score-teams"><div><span>HOME TEAM</span><strong id="homeScore">00</strong><small>FOULES <b id="homeFouls">0</b> · TM <b>3</b></small></div><div class="versus">VS</div><div><span>AWAY TEAM</span><strong id="awayScore">00</strong><small>FOULES <b id="awayFouls">0</b> · TM <b>3</b></small></div></div><div class="clock" id="clock">10:00</div><div class="score-controls"><div><label>HOME</label><button onclick="addScore('home',1)">+1</button><button onclick="addScore('home',2)">+2</button><button onclick="addScore('home',3)">+3</button><button class="minus" onclick="addScore('home',-1)">−1</button></div><div><label>AWAY</label><button onclick="addScore('away',1)">+1</button><button onclick="addScore('away',2)">+2</button><button onclick="addScore('away',3)">+3</button><button class="minus" onclick="addScore('away',-1)">−1</button></div></div><div class="clock-controls"><button onclick="toggleClock()" id="clockButton">▶ Démarrer</button><button onclick="resetClock()">↻ Réinitialiser</button><select onchange="setPeriod(this.value)"><option>Q1</option><option>Q2</option><option>Q3</option><option>Q4</option><option>OT</option></select></div></div>{% endblock %}{% block scripts %}<script>let home=0,away=0,seconds=600,timer=null;function addScore(team,points){if(team==='home')home=Math.max(0,home+points);else away=Math.max(0,away+points);document.getElementById(team+'Score').textContent=String(team==='home'?home:away).padStart(2,'0')}function renderClock(){document.getElementById('clock').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}function toggleClock(){if(timer){clearInterval(timer);timer=null;document.getElementById('clockButton').textContent='▶ Reprendre'}else{timer=setInterval(()=>{if(seconds>0){seconds--;renderClock()}else toggleClock()},1000);document.getElementById('clockButton').textContent='Ⅱ Pause'}}function resetClock(){if(timer)toggleClock();seconds=600;renderClock()}function setPeriod(value){document.getElementById('periodLabel').textContent=value+' · '+document.getElementById('clock').textContent}</script>{% endblock %}
