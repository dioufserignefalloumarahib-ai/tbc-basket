{% extends 'base.html' %}{% block title %}{{ form_title }}{% endblock %}{% block heading %}{{ form_title }}{% endblock %}{% block content %}<section class="panel form-panel"><form method="post" class="edit-form"><div class="form-grid"><label>Prénom *<input name="first_name" required value="{{ player.first_name if player else '' }}"></label><label>Nom *<input name="last_name" required value="{{ player.last_name if player else '' }}"></label><label>Date de naissance<input type="date" name="birth_date" value="{{ player.birth_date if player else '' }}"></label><label>Numéro de maillot<input type="number" name="jersey_number" min="0" max="99"></label><label>Poste<select name="position"><option value="">Choisir</option>{% for item in ['Meneur','Arrière','Ailier','Ailier fort','Pivot'] %}<option>{{ item }}</option>{% endfor %}</select></label><label>Équipe<select name="team_id"><option value="">Sans équipe</option>{% for team in teams %}<option value="{{ team.id }}">{{ team.name }}</option>{% endfor %}</select></label><label>Téléphone<input name="phone"></label><label>Taille (cm)<input type="number" step="0.1" name="height"></label><label>Adresse<input name="address"></label><label>Statut<select name="status"><option>Actif</option><option>Inactif</option><option>Blessé</option></select></label></div><div class="form-actions"><a class="button outline" href="{{ url_for('players') }}">Annuler</a><button class="button primary">Enregistrer le joueur</button></div></form></section>{% endblock %}
