{% extends 'base.html' %}{% block title %}{{ form_title }}{% endblock %}{% block heading %}{{ form_title }}{% endblock %}{% block content %}<section class="panel form-panel"><form method="post" class="edit-form"><div class="form-grid"><label>Nom *<input name="name" required value="{{ category.name if category else '' }}"></label><label>Tranche d'âge<input name="age_range" value="{{ category.age_range if category else '' }}"></label><label>Sexe / équipe<select name="gender"><option {% if not category or category.gender == 'Mixte' %}selected{% endif %}>Mixte</option><option {% if category and category.gender == 'Féminines' %}selected{% endif %}>Féminines</option><option {% if category and category.gender == 'Masculins' %}selected{% endif %}>Masculins</option></select></label><label>Entraîneur<input name="coach" value="{{ category.coach if category else '' }}"></label><label>Statut<select name="status"><option value="active" {% if not category or category.status == 'active' %}selected{% endif %}>Active</option><option value="inactive" {% if category and category.status == 'inactive' %}selected{% endif %}>Inactive</option></select></label><label class="full">Description<textarea name="description" rows="4">{{ category.description if category else '' }}</textarea></label><label class="full">Joueurs associés<select name="player_ids" multiple>{% for player in players %}<option value="{{ player.id }}" {% if player.id in selected %}selected{% endif %}>{{ player.first_name }} {{ player.last_name }}</option>{% endfor %}</select></label></div><div class="form-actions"><a class="button outline" href="{{ url_for('classes_systems') }}">Annuler</a><button class="button primary">Enregistrer</button></div></form></section>{% endblock %}
